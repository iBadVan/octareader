[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octareader"
version = "0.1.0"
description = "Vision-based reader for Peruvian front-of-package warning octagons"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
